[workspace]
resolver = "3"
members = [
    "openrouter",
    "models-dev",
    "codex",
    "anthropic",
    "openai",
    "google",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
norte-code-wire = { git = "https://github.com/JeanVydes/NorteCode.git", branch = "dev" }
norte-code-plugin-host = { git = "https://github.com/JeanVydes/NorteCode.git", branch = "dev" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
